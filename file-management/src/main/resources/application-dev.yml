spring:
  datasource:
    url: jdbc:mysql://localhost:3306/excel_dashboard_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

app:
  upload-dir: C:/ExcelViewingDashboard/uploads

server:
  port: 8081